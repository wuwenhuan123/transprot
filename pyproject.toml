[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transprot"
version = "0.1.0"
description = "Lightweight Windows screen OCR utility built with PySide6."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Codex" }
]
dependencies = []

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8"
]
ocr = [
  "Pillow>=10.4",
  "paddleocr>=2.9.1",
  "paddlepaddle==3.3.1"
]
build = [
  "pyinstaller>=6.14"
]

[project.scripts]
transprot = "transprot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
